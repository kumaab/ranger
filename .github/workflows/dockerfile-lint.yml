# Lints the Dockerfiles with hadolint; see .hadolint.yaml for the rule set.
#
# This lives in its own workflow rather than as a job in ci.yml so that the paths
# filter below can skip it entirely: GitHub applies "paths" per workflow, not per
# job, so a job in ci.yml would need either a third-party filter action or an extra
# change-detection job that costs a runner on every pull request.
name: dockerfile-lint

on:
  # Keep the two paths lists identical. GitHub Actions does not support YAML
  # anchors, so they cannot be shared.
  push:
    paths:
      # The check lints every tracked Dockerfile in the repository, so trigger on
      # Dockerfiles anywhere, not only the ones under dev-support/ranger-docker.
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      # Re-lint everything when the rule set, the runner script or this workflow change.
      - '.hadolint.yaml'
      - 'dev-support/checks/hadolint.sh'
      - '.github/workflows/dockerfile-lint.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '.hadolint.yaml'
      - 'dev-support/checks/hadolint.sh'
      - '.github/workflows/dockerfile-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dockerfile-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Lint Dockerfiles with hadolint
        run: ./dev-support/checks/hadolint.sh
