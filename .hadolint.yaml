# Configuration for hadolint (https://github.com/hadolint/hadolint), the Dockerfile
# linter run by dev-support/checks/hadolint.sh and by the "dockerfile-lint" CI job.
# Rule reference: https://github.com/hadolint/hadolint/blob/master/docs/INSTALL.md#rules

# Findings below this severity are reported but do not fail the build, so a new style
# nit never blocks a contributor. Anything at warning or above must be fixed.
failure-threshold: warning

# No project-wide rule exemptions. A blanket "ignored" list here would let any rule be
# switched off for the whole repository in a one-line diff, which is exactly the review
# signal this check exists to provide. Where a rule genuinely cannot be satisfied by a
# single instruction, suppress it at that instruction with an inline
# "# hadolint ignore=<rule>" comment and a note explaining why, so the exemption is
# visible in the diff that introduces it and is scoped to the line it applies to.
